[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "janaf-thermo"
version = "0.1.0"
description = "JANAF (2nd ed., 1971) thermochemical tables for 15 species, with SI property functions and reaction thermodynamics"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mohamad Hosein Hemasian Etefagh" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
janaf_thermo = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
